<style>

ified rights with defined enforcement mechanisms"], "mbti": "ESTJ", "avg_scores": {"E_I": 0.35, "S_N": 0.578, "T_F": 0.572, "J_P": 0.488}}, "1": {"name": "Sovereign Covenant Keeper", "description": "These states guard their cultural, religious, or ideological identity with fierce resolve, drawing legitimacy from a deep sense of collective purpose rather than liberal individualism. They tend to organize society around binding shared values \u2014 whether rooted in faith, tradition, or revolutionary doctrine \u2014 and resist external interference as a matter of existential principle. Their rigidity reflects not mere stubbornness but a conviction that the social covenant, once defined, must be protected against dissolution.", "key_themes": ["Cultural or ideological self-determination over international norms", "Collective identity as the foundation of political legitimacy", "Resistance to liberal universalism and foreign influence", "Faith, tradition, or doctrine as constitutional anchors", "Inward-looking solidarity with aspirational national narratives"], "mbti": "INFJ", "avg_scores": {"E_I": -0.6, "S_N": -0.467, "T_F": -0.475, "J_P": 0.383}}, "2": {"name": "Communal Sovereign Order", "description": "These constitutions enshrine a strong, inward-facing state authority that prioritizes collective identity and social harmony over individual rights, grounding legitimacy in shared duty rather than personal liberty. They tend toward prescriptive, rule-bound frameworks that resist liberal pluralism, often embedding cultural, religious, or nationalist values as foundational constitutional norms. The state is cast as guardian and provider, with rigid structures designed to preserve social cohesion and sovereign integrity against external influence.", "key_themes": ["Collective duty over individual rights", "Strong centralized or sovereign authority", "Prescriptive moral or cultural foundations (religious, nationalist, or traditionalist)", "Resistance to liberal pluralism and foreign interference", "Social cohesion as a primary constitutional value"], "mbti": "ISFJ", "avg_scores": {"E_I": -0.461, "S_N": 0.439, "T_F": -0.378, "J_P": 0.467}}, "3": {"name": "Adaptive Sovereignty Compact", "description": "These constitutions assert strong sovereign identity and concrete, rule-based frameworks while remaining structurally open to reinterpretation and organic evolution over time. They tend to codify specific institutional arrangements and prescriptive norms, yet treat the constitutional text as a living instrument that bends to political and social pressures rather than rigidly constraining them. The cluster reflects nations where formal constitutional architecture often coexists with fluid, contested, or pragmatic implementation on the ground.", "key_themes": ["Sovereign self-determination with minimal external constitutional influence", "Concrete, prescriptive rule-setting over abstract principles", "Institutional structures that prioritize practical governance over ideological purity", "Constitutional flexibility and amendability as political survival mechanisms", "Tension between formal legal order and real-world political adaptability"], "mbti": "ISTP", "avg_scores": {"E_I": -0.044, "S_N": 0.533, "T_F": 0.322, "J_P": -0.4}}, "4": {"name": "The Sovereign Custodian", "description": "These constitutions prioritize the preservation of established order, vesting authority in strong central institutions that govern through detailed, prescriptive legal frameworks. They lean toward state sovereignty and institutional continuity over expansive individual rights, reflecting a political philosophy that sees disciplined governance and hierarchical structure as the foundation of social stability. The remarkable diversity of regimes in this cluster \u2014 from liberal democracies to authoritarian states \u2014 suggests that this constitutional personality transcends ideology, uniting systems that share a common instinct to codify power clearly and guard it jealously.", "key_themes": ["State sovereignty and centralized authority", "Prescriptive, rule-dense legal frameworks", "Institutional permanence over popular flexibility", "Preference for order and procedural rigor", "Guardianship of the established constitutional settlement"], "mbti": "ISTJ", "avg_scores": {"E_I": -0.443, "S_N": 0.561, "T_F": 0.512, "J_P": 0.524}}, "5": {"name": "The Pragmatic Sovereign", "description": "These constitutions reflect a grounded, restrained approach to political organization \u2014 prioritizing concrete institutional mechanics over grand ideological vision, while guarding national autonomy above supranational entanglement. They are neither rigidly fixed nor fluidly adaptive, hovering near the center of every axis, suggesting constitutions built for functional governance rather than transformative politics. The diversity of this cluster \u2014 from Monaco's principality to Mongolia's steppe republic \u2014 hints at a shared constitutional temperament of quiet, workmanlike self-determination.", "key_themes": ["Institutional pragmatism over ideological ambition", "Sovereignty and national self-determination", "Balanced flexibility \u2014 neither rigid nor overly adaptive", "Concrete rule-setting rather than aspirational framing", "Minimal ideological signature \u2014 governance as craft"], "mbti": "ISTP", "avg_scores": {"E_I": -0.042, "S_N": 0.017, "T_F": 0.017, "J_P": -0.017}}, "6": {"name": "Aspirational Social Contract", "description": "These constitutions project an outward-facing, idealistic vision of society built on collective well-being and solidarity, often reflecting post-colonial or transitional aspirations for dignity and justice. They tend to enshrine ambitious social and economic rights alongside strong communitarian values, frequently borrowing from international human rights frameworks while asserting a structured, directive state role. The tension between lofty ideals and fragile institutional realities is a defining characteristic.", "key_themes": ["Post-colonial and transitional aspirationalism", "Strong social and economic rights guarantees", "Communitarian solidarity over individual liberty", "International human rights integration", "Directive state with structured governance ideals"], "mbti": "ENFJ", "avg_scores": {"E_I": 0.304, "S_N": -0.264, "T_F": -0.118, "J_P": 0.139}}}, "countries": [{"country_id": "Afghanistan", "country": "Afghanistan", "cluster": 1, "mbti": "ISFJ", "scores": {"E_I": -0.5, "S_N": -0.4, "T_F": -0.3, "J_P": 0.3}, "x": -0.9406282901763916, "y": 2.1114728450775146}, {"country_id": "Albania", "country": "Albania", "cluster": 0, "mbti": "ESTJ", "scores": {"E_I": 0.3, "S_N": 0.7, "T_F": 0.8, "J_P": 0.4}, "x": 1.0024895668029785, "y": 15.195745468139648}, {"country_id": "Algeria", "country": "Algeria", "cluster": 6, "mbti": "ENTJ", "scores": {"E_I": 0.2, "S_N": -0.2, "T_F": 0.4, "J_P": 0.5}, "x": -1.4606566429138184, "y": 4.8271589279174805}, {"country_id": "Andorra", "country": "Andorra", "cluster": 4, "mbti": "ISTJ", "scores": {"E_I": -0.6, "S_N": 0.5, "T_F": 0.3, "J_P": 0.6}, "x": 7.118959426879883, "y": 6.499902725219727}, {"country_id": "Angola", "country": "Angola", "cluster": 4, "mbti": "ISTJ", "scores": {"E_I": -0.3, "S_N": 0.3, "T_F": 0.5, "J_P": 0.2}, "x": 3.7105860710144043, "y": 8.117114067077637}, {"country_id": "Antigua_and_Barbuda", "country": "Antigua and Barbuda", "cluster": 4, "mbti": "ISTJ", "scores": {"E_I": -0.5, "S_N": 0.8, "T_F": 0.6, "J_P": 0.7}, "x": 7.223655700683594, "y": 8.652835845947266}, {"country_id": "Argentina", "country": "Argentina", "cluster": 4, "mbti": "ISTJ", "scores": {"E_I": -0.4, "S_N": 0.5, "T_F": 0.5, "J_P": 0.3}, "x": 4.135372161865234, "y": 8.389533042907715}, {"country_id": "Armenia", "country": "Armenia", "cluster": 0, "mbti": "ESTJ", "scores": {"E_I": 0.1, "S_N": 0.6, "T_F": 0.7, "J_P": 0.6}, "x": 2.0494866371154785, "y": 15.258816719055176}, {"country_id": "Australia", "country": "Australia", "cluster" mbti": "ISFJ", "scores": {"E_I": -0.4, "S_N": 0.5, "T_F": -0.3, "J_P": 0.6}, "x": 2.1813418865203857, "y": 2.0602757930755615}]}, "vibes": {"name": "Vibes-Based Governance", "description": "Constitutional vibes, decoded", "dimensions": {"E_I": {"name": "E/I", "E_label": "Talks to the UN at parties", "I_label": "Doesn't answer the door", "E_desc": "International obligations everywhere, references to treaties, cooperation, global community", "I_desc": "We do things our way, national sovereignty, minimal foreign entanglement"}, "S_N": {"name": "S/N", "S_label": "Has a spreadsheet for everything", "N_label": "Has a vision board", "S_desc": "Articles about tax percentages, pension ages, exact quorum numbers, parliamentary procedure", "N_desc": "Justice, dignity, the flourishing of all peoples, sweeping preambles about eternal truths"}, "T_F": {"name": "T/F", "T_label": "The org chart IS the point", "F_label": "Won't somebody think of the children", "T_desc": "Who appoints whom, how many judges, which committee reviews what, institutional plumbing", "F_desc": "Rights, welfare, education, healthcare, social protection, human dignity"}, "J_P": {"name": "J/P", "J_label": "The constitution is FINAL", "P_label": "It's a living document, sweetie", "J_desc": "Eternity clauses, unamendable core, supermajority to change anything, constitutional court guardianship", "P_desc": "Regular review, easy amendment, sunset clauses, participatory revision mechanisms"}}, "archetypes": {"0": {"name": "The Vibe Auditor", "description": "This archetype governs by the feeling that rules exist and must be respected \u2014 not because anyone can fully explain why, but because the structure itself radiates authority. The org chart hums with a quiet, serious energy, and the constitution is treated less like a living document than a sealed verdict. Order isn't enforced so much as *sensed*, like a draft from under a very important door.", "key_themes": ["Hierarchy as ambient mood", "Rules that feel older than their authors", "Paperwork as spiritual practice", "Introversion encoded into law", "The constitution as closed case"], "mbti": "ISTJ", "avg_scores": {"E_I": -0.415, "S_N": 0.496, "T_F": 0.56, "J_P": 0.562}}, "1": {"name": "The Visionary Convener", "description": "This archetype governs by collective feeling and aspirational narrative, drafting constitutions that read like heartfelt manifestos rather than legal documents. It shows up to every international forum with a PowerPoint full of dreams and a genuine belief that if everyone just *talks it out*, justice will emerge. The rules are settled, the vision is sacred, and the vibes are \u2014 most importantly \u2014 unified.", "key_themes": ["Aspirational constitutionalism", "Community-centered rights language", "Structured idealism", "International solidarity rhetoric", "Emotional consensus-building"], "mbti": "ENFJ", "avg_scores": {"E_I": 0.415, "S_N": -0.446, "T_F": -0.346, "J_P": 0.385}}, "2": {"name": "The Passionate Dreamer State", "description": "These countries govern on feeling, aspiration, and the perpetual promise of transformation \u2014 constitutions read like love letters to a future that keeps getting rescheduled. They're enthusiastic participants in international discourse, quick to sign declarations and slower to implement them, because the vibe of progress matters as much as the progress itself. Deeply people-centered in rhetoric, they oscillate between revolutionary idealism and improvisational crisis management, united by an unshakeable belief that the right vision, loudly proclaimed, is halfway to reality.", "key_themes": ["Aspirational constitutionalism \u2014 rights and promises written in poetry, implemented in pencil", "Emotionally-driven legitimacy over procedural consistency", "Recurring cycles of reform energy that peak before institutionalizing", "Strong civil society voice amid fragile state capacity", "International idealism paired with domestic turbulence"], "mbti": "ENFP", "avg_scores": {"E_I": 0.169, "S_N": -0.538, "T_F": -0.469, "J_P": -0.381}}, "3": {"name": "Quiet Tinkerer Republic", "description": "These constitutions don't make a scene \u2014 they just quietly rewire the fuse box at 2am and leave a note. Structured enough to have a flowchart for everything, flexible enough to pencil over it constantly, and deeply uninterested in explaining themselves to anyone who didn't ask. The vibe is 'we have a system, it's evolving, leave us alone.'", "key_themes": ["Procedural pragmatism over ideological spectacle", "Flexible frameworks that resist final answers", "Institutional structure as personal comfort object", "Low-key sovereignty \u2014 functional but not performative", "Amendment culture disguised as stability"], "mbti": "ISTP", "avg_scores": {"E_I": -0.26, "S_N": 0.28, "T_F": 0.107, "J_P": -0.413}}, "4": {"name": "The Iron Podium", "description": "These states project authority loudly and often, treating governance itself as a performance of control rather than a service. They maintain rigid hierarchies and finalized power structures with the energy of someone who laminated their own org chart and framed it. Vague aspirational aesthetics coexist uncomfortably with an ironclad insistence that the rules are settled \u2014 and that they personally wrote them.", "key_themes": ["Performative authority \u2014 legitimacy through presence and projection", "Hierarchy as identity \u2014 the structure IS the ideology", "Closed constitutionalism \u2014 rules are final because we said so", "Aspirational veneer over rigid realpolitik", "International engagement as dominance display, not dialogue"], "mbti": "ENTJ", "avg_scores": {"E_I": 0.411, "S_N": -0.344, "T_F": 0.456, "J_P": 0.478}}, "5": {"name": "Bureaucratic Swagger Council", "description": "These constitutions radiate the energy of a very confident middle manager who has laminated every policy memo and color-coded the org chart. They govern through structured enthusiasm \u2014 not cold technocracy, but a genuine *vibe* that the system, properly followed, is its own reward. Order here isn't imposed from fear; it's celebrated like a well-run meeting that ended exactly on time.", "key_themes": ["Procedural confidence as national identity", "Institutions as load-bearing vibes", "Enthusiastic compliance culture", "Democratic structure with a firm handshake", "The feeling that rules were written by someone who really cared"], "mbti": "ESTJ", "avg_scores": {"E_I": 0.379, "S_N": 0.452, "T_F": 0.521, "J_P": 0.552}}, "6": {"name": "The Architect of Order", "description": "These constitutions don't invite debate \u2014 they declare destiny. Power flows through carefully drawn hierarchies, and the document itself radiates a sense of inevitability, as if the state were always going to look exactly like this. Legitimacy is performed through structure, not participation.", "key_themes": ["Hierarchical authority enshrined in law", "Visionary nationalism with closed feedback loops", "Institutional form over democratic function", "The constitution as monument, not mechanism", "Stability as the supreme constitutional value"], "mbti": "INTJ", "avg_scores": {"E_I": -0.484, "S_N": -0.421, "T_F": 0.4, "J_P": 0.626}}, "7": {"name": "The Visionary Caretaker", "description": "These constitutions radiate quiet moral intensity \u2014 they dream of a better world, feel deeply responsible for the vulnerable, and have committed their ideals to paper with solemn finality. There's a sense of a founding generation that sat in a room, felt the weight of history, and wrote it all down before anyone could change their mind. The document is both a prophecy and a promise, delivered with the energy of someone who has seen too much suffering to leave justice to chance.", "key_themes": ["Aspirational social justice enshrined as permanent law", "Strong protective instincts toward marginalized and vulnerable populations", "Introversion of governance \u2014 legitimacy flows from moral conviction, not popular energy", "Utopian vision tempered by procedural rigidity", "Post-colonial or post-conflict longing for stability and dignity"], "mbti": "INFJ", "avg_scores": {"E_I": -0.427, "S_N": -0.407, "T_F": -0.473, "J_P": 0.347}}, "8": {"name": "Anxious Nesting Bureaucrat", "description": "This constitutional personality keeps the blinds drawn, the rules laminated, and the feelings just barely beneath the surface of every procedural clause. It governs like a worried aunt who has color-coded the emergency binder but will absolutely cry at the preamble. Order is sacred, sentiment is real, and the door is technically open but please call first.", "key_themes": ["Protective proceduralism \u2014 rules exist to shield, not just to control", "Sentimental legalism \u2014 emotional and moral language embedded in formal structures", "Structured conservatism \u2014 change is permissible only after extensive documentation", "Institutional introversion \u2014 strong internal institutions, skeptical of external disruption", "Duty-bound governance \u2014 obligation and care as the twin engines of constitutional identity"], "mbti": "ISFJ", "avg_scores": {"E_I": -0.394, "S_N": 0.356, "T_F": -0.372, "J_P": 0.478}}}, "countries": [{"country_id": "Afghanistan", "country": "Afghanistan", "cluster": 1, "mbti": "ISFJ", "scores": {"E_I": 0.3, "S_N": -0.7, "T_F": -0.3, "J_P": 0.5}, "x": 19.589147567749023, "y": -3.5126519203186035}, {"country_id": "Albania", "country": "Albania", "cluster": 5, "mbti": "ESTJ", "scores": {"E_I": 0.2, "S_N": 0.4, "T_F": 0.7, "J_P": 0.6}, "x": 9.968488693237305, "y": 9.456611633300781}, {"country_id": "Algeria", "country": "Algeria", "cluster": 4, "mbti": "ENTJ", "scores": {"E_I": 0.4, "S_N": -0.5, "T_F": 0.4, "J_P": 0.7}, "x": 11.229081153869629, "y": 6.271194934844971}, {"country_id": "Andorra", "country": "Andorra", "cluster": 0, "mbti": "ISTJ", "scores": {"E_I": -0.5, "S_N": 0.3, "T_F": 0.5, "J_P": 0.4}, "x": -2.4960217475891113, "y": -0.97728633880615 // Colors organized by MBTI dimensions:
// E = warm (oranges/reds/ambers), I = cool (blues/teals/slate)
// N = more vivid, S = more muted/earthy
// J = deeper, P = lighter
const MBTI_COLORS = {
  // I_S_ — cool, muted
  'ISTJ': '#5b7fa6',  // dusty steel blue
  'ISFJ': '#6a9b8a',  // sage green
  'ISTP': '#7daab5',  // light teal
  'ISFP': '#8abfa5',  // soft mint
  // I_N_ — cool, vivid
  'INTJ': '#5e5eb5',  // indigo
  'INFJ': '#8b6aaf',  // soft purple
  'INTP': '#6ba3d6',  // bright blue
  'INFP': '#b088c8',  // lavender
  // E_S_ — warm, muted
  'ESTJ': '#c27a3a',  // amber
  'ESFJ': '#b5694d',  // terracotta
  'ESTP': '#d4944a',  // warm gold
  'ESFP': '#d6a656',  // honey
  // E_N_ — warm, vivid
  'ENTJ': '#d45a2a',  // burnt orange (near your #fe6019)
  'ENFJ': '#e07040',  // coral
  'ENTP': '#e8985a',  // apricot
  'ENFP': '#e86060',  // warm red
};

let currentLens = Object.keys(lenses)[0];
let hoveredIdx = -1;
let searchQuery = '';

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
let dpr = window.devicePixelRatio || 1;
let viewX = 0, viewY = 0, viewScale = 1;
let isDragging = false, dragStartX = 0, dragStartY = 0;

function getLens() { return lenses[currentLens]; }
function getCountries() { return getLens().countries; }

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resetView() {
  const countries = getCountries();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const c of countries) {
    minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
    minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
  }
  const rect = canvas.parentElement.getBoundingClientRect();
  const padX = (maxX - minX) * 0.12;
  const padY = (maxY - minY) * 0.12;
  const scaleX = rect.width / (maxX - minX + 2 * padX);
  const scaleY = rect.height / (maxY - minY + 2 * padY);
  viewScale = Math.min(scaleX, scaleY);
  viewX = rect.width / 2 - ((minX + maxX) / 2) * viewScale;
  viewY = rect.height / 2 - ((minY + maxY) / 2) * viewScale;
}

function toScreen(x, y) {
  return { x: x * viewScale + viewX, y: y * viewScale + viewY };
}

function draw() {
  const rect = canvas.parentElement.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  const countries = getCountries();
  const lens = getLens();
  const matchSet = searchQuery
    ? new Set(countries.filter(c => c.country.toLowerCase().includes(searchQuery)).map(c => c.country_id))
    : null;

  for (let i = 0; i < countries.length; i++) {
    const c = countries[i];
    const s = toScreen(c.x, c.y);
    const color = MBTI_COLORS[c.mbti] || '#666';
    const isMatch = !matchSet || matchSet.has(c.country_id);
    const isHovered = i === hoveredIdx;

    ctx.globalAlpha = isMatch ? 1.0 : 0.12;
    ctx.beginPath();
    ctx.arc(s.x, s.y, isHovered ? 9 : 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    if (isHovered) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (viewScale > 25 || isHovered || (isMatch && matchSet)) {
      ctx.fillStyle = isMatch ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.15)';
      ctx.font = `${isHovered ? '700 13px' : '400 10px'} Poppins, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(c.country, s.x, s.y - 10);
    }
  }
  ctx.globalAlpha = 1.0;
  requestAnimationFrame(draw);
}

function findNearest(mx, my) {
  const countries = getCountries();
  let best = -1, bestDist = 20;
  for (let i = 0; i < countries.length; i++) {
    const s = toScreen(countries[i].x, countries[i].y);
    const d = Math.hypot(s.x - mx, s.y - my);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

function fmtScore(v) {
  return v >= 0 ? '+' + v.toFixed(2) : v.toFixed(2);
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (isDragging) {
    viewX += e.clientX - dragStartX;
    viewY += e.clientY - dragStartY;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    return;
  }

  hoveredIdx = findNearest(mx, my);
  if (hoveredIdx >= 0) {
    const c = getCountries()[hoveredIdx];
    const lens = getLens();
    const arch = lens.archetypes[String(c.cluster)];
    const dims = lens.dimensions;
    const sc = c.scores || {};
    tooltip.innerHTML = `
      <div class="tt-country">${c.country}</div>
      <div class="tt-archetype">${arch?.name || '?'}</div>
      <div class="tt-mbti" style="color:${MBTI_COLORS[c.mbti] || '#fff'}">${c.mbti}</div>
      <div class="tt-scores">
        <span>${dims.E_I?.name}: ${fmtScore(sc.E_I || 0)}</span>
        <span>${dims.S_N?.name}: ${fmtScore(sc.S_N || 0)}</span>
        <span>${dims.T_F?.name}: ${fmtScore(sc.T_F || 0)}</span>
        <span>${dims.J_P?.name}: ${fmtScore(sc.J_P || 0)}</span>
      </div>
    `;
    tooltip.style.opacity = '1';
    // Keep tooltip in bounds
    const tx = Math.min(mx + 16, rect.width - 310);
    const ty = Math.min(my - 10, rect.height - 120);
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.opacity = '0';
    canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
  }
});

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
canvas.addEventListener('mouseleave', () => {
  isDragging = false; hoveredIdx = -1; tooltip.style.opacity = '0';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  viewX = mx - (mx - viewX) * factor;
  viewY = my - (my - viewY) * factor;
  viewScale *= factor;
}, { passive: false });

function switchLens(lensId) {
  currentLens = lensId;
  hoveredIdx = -1;
  resetView();
  renderLensButtons();
  renderSidebar();
}

function renderLensButtons() {
  const container = document.getElementById('lens-buttons');
  container.innerHTML = '';
  for (const [id, lens] of Object.entries(lenses)) {
    const btn = document.createElement('button');
    btn.className = 'lens-btn' + (id === currentLens ? ' active' : '');
    btn.textContent = lens.name;
    btn.onclick = () => switchLens(id);
    container.appendChild(btn);
  }
}

function renderSidebar() {
  const lens = getLens();

  // Dimension guide (prominent, at top, full write-up)
  const guide = document.getElementById('dimension-guide');
  guide.innerHTML = `<h2>${lens.name}</h2><div class="lens-desc">${lens.description}</div>`;
  for (const [key, dim] of Object.entries(lens.dimensions)) {
    const [first, second] = key.split('_');
    guide.innerHTML += `
      <div class="dim-block">
        <div class="dim-header">
          <span class="letters"><span class="pos">${first}</span><span class="slash">/</span><span class="neg">${second}</span></span>
        </div>
        <div class="dim-pole">
          <span class="pole-letter pos">${first}</span>
          <span><span class="pole-name">${dim[first + '_label']}</span> &mdash; <span class="pole-desc">${dim[first + '_desc']}</span></span>
        </div>
        <div class="dim-pole">
          <span class="pole-letter neg">${second}</span>
          <span><span class="pole-name">${dim[second + '_label']}</span> &mdash; <span class="pole-desc">${dim[second + '_desc']}</span></span>
        </div>
      </div>
    `;
  }

  // Archetype cards
  const list = document.getElementById('archetype-list');
  list.innerHTML = '';
  const countries = getCountries();
  const clusterIds = Object.keys(lens.archetypes).sort((a, b) => Number(a) - Number(b));

  for (const cid of clusterIds) {
    const arch = lens.archetypes[cid];
    const count = countries.filter(c => c.cluster === Number(cid)).length;
    const color = MBTI_COLORS[arch.mbti] || '#666';

    const card = document.createElement('div');
    card.className = 'archetype-card';
    card.style.borderLeftColor = color;
    card.innerHTML = `
      <div class="top-row">
        <span class="name" style="color: ${color}">${arch.name}</span>
        <span class="mbti" style="color: ${color}">${arch.mbti}</span>
      </div>
      <div class="desc">${arch.description}</div>
      <div class="count">${count} countries</div>
    `;
    list.appendChild(card);
  }
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase();
});

window.addEventListener('resize', () => { resizeCanvas(); resetView(); });
resizeCanvas();
resetView();
renderLensButtons();
renderSidebar();
draw();
</script>
</body>
</html>
